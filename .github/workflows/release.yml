name: Release

# This workflow and scripts/release-local.sh are both live and both publish the
# same three things: the community GitHub release, npm, and the MCP registry.
# They have collided before, which is how the 0.10.7 assets were corrupted, so
# every write here is now a single-writer operation:
#
#   - preflight runs first and fails in seconds on a rotten credential, rather
#     than after seven minutes of build minutes have already been spent and a
#     GitHub release is public with no npm package to match it. v0.10.9 shipped
#     to GitHub and never reached npm exactly that way, on an NPM_TOKEN that had
#     stopped being authorized.
#   - the community release is created only if it does not already exist. If
#     release-local.sh got there first, this leaves its assets alone rather than
#     deleting and re-uploading underneath anyone mid-download.
#   - npm publish is skipped, not failed, when the version is already published.
#
# The consequence of preflight gating the build: a dead credential now blocks
# the GitHub release too, so curl installers wait alongside npm installers. That
# is deliberate. A release that exists on one channel and not the other is the
# skew this is here to prevent.

on:
  push:
    # Two ways in, one path out. A tag push releases that tag. A version bump on
    # main releases the new version and creates the tag itself, which is what
    # auto-tag.yml used to do badly: it pushed the tag with GITHUB_TOKEN, and
    # GitHub refuses to start a workflow from that token, so the tag appeared and
    # nothing built. Its documented workaround was a long-lived PAT, which is the
    # kind of credential that expires quietly and breaks releases months later.
    tags:
      - "v*"
    branches: [main]
    paths:
      - Cargo.toml
  # Releasing the version already in Cargo.toml, for when a release needs
  # re-running without a version bump.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Releases land in this repo, so the workflow's own GITHUB_TOKEN is enough
  # and a fork releases to itself rather than failing on a missing PAT.
  RELEASE_REPO: ${{ github.repository }}

jobs:
  resolve:
    name: Decide what is being released
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # A Cargo.toml edit that is not a version bump must do nothing.
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} already exists. Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

          # Created through the refs API, not `git push`. Pushing an annotated tag
          # object from a runner is rejected here with "fatal error in commit_refs",
          # reproducibly. Creating the ref directly is the supported path and needs
          # no extra credential.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "::notice::Created ${TAG} at ${GITHUB_SHA}."

  preflight:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # No npm credential to check. Publishing uses OIDC trusted publishing: npm
      # mints a short-lived credential from the publish job's own identity, so
      # there is no stored token to be unset, expired or revoked, and nothing to
      # pre-validate here. What can still fail is the trusted publisher not being
      # configured for a package on npmjs.com, and the registry only reveals that
      # on the publish itself, which is where its error is surfaced.


  build:
    needs: [resolve, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: contains(matrix.target, 'linux')
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Build (macOS)
        if: contains(matrix.target, 'apple')
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/drengr --remap-path-prefix=$HOME/.cargo/registry/src=/deps --remap-path-prefix=src/=/m/"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Linux)
        if: contains(matrix.target, 'linux')
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/drengr --remap-path-prefix=$HOME/.cargo/registry/src=/deps --remap-path-prefix=src/=/m/"
        run: cross build --release --target ${{ matrix.target }}

      - name: Build iOS helper (macOS only)
        if: contains(matrix.target, 'apple')
        run: |
          swiftc -O helpers/ios-helper/main.swift -o target/${{ matrix.target }}/release/drengr-ios-helper
          strip target/${{ matrix.target }}/release/drengr-ios-helper
          echo "iOS helper built: $(ls -lh target/${{ matrix.target }}/release/drengr-ios-helper)"

      - name: Package tarball
        run: |
          VERSION="${{ needs.resolve.outputs.tag }}"
          ARCHIVE="drengr-${VERSION}-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          if [ -f drengr-ios-helper ]; then
            tar czf "../../../${ARCHIVE}" drengr drengr-ios-helper
          else
            tar czf "../../../${ARCHIVE}" drengr
          fi
          cd ../../..
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Verify binary hardening
        run: |
          BINARY="target/${{ matrix.target }}/release/drengr"
          echo "=== Checking for leaked source paths ==="
          SRC_COUNT=$(strings "${BINARY}" | grep -c "src/" || true)
          echo "Source path references: ${SRC_COUNT}"
          if [ "${SRC_COUNT}" -gt 5 ]; then
            echo "WARNING: Binary contains ${SRC_COUNT} source path references"
            strings "${BINARY}" | grep "src/" | head -20
          fi
          echo "=== Checking symbol strip ==="
          if command -v nm >/dev/null 2>&1; then
            nm "${BINARY}" 2>&1 | head -5 || true
          fi
          echo "=== Binary size ==="
          ls -lh "${BINARY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: drengr-${{ matrix.target }}
          path: |
            drengr-*.tar.gz
            drengr-*.tar.gz.sha256
          # Pure build->release hand-off within this run, never the actual release
          # asset — expire fast so it can't silently exhaust Actions storage quota
          # the way 160 of these (881 MB, since 2026-06-05) just did.
          retention-days: 1

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      # The .mcpb bundle is manifest + one macOS binary, zipped. It used to be a
      # 4.6MB executable committed to the tree that nothing regenerated, so it
      # drifted from the source it claimed to be. Built here or not at all.
      - name: Assemble the mcpb bundle
        run: |
          set -euo pipefail
          BUNDLE=$(mktemp -d)
          cp "${GITHUB_WORKSPACE}/mcpb/manifest.json" "$BUNDLE/manifest.json"
          mkdir -p "$BUNDLE/server"
          tar -xzf drengr-*-aarch64-apple-darwin.tar.gz -C "$BUNDLE/server" drengr
          ( cd "$BUNDLE" && zip -qr "${GITHUB_WORKSPACE}/drengr.mcpb" . )
          echo "built drengr.mcpb ($(du -h drengr.mcpb | cut -f1))"

      - name: Generate checksums
        run: |
          echo '## SHA256 Checksums' > checksums.md
          echo '```' >> checksums.md
          cat *.sha256 >> checksums.md
          echo '```' >> checksums.md

      - name: GPG sign checksums
        if: ${{ env.HAS_GPG == 'true' }}
        env:
          HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for sha in *.sha256; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$sha"
          done
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --clearsign --output checksums.txt <(cat *.sha256)

      # Release on private repo (internal record)
      - name: Create GitHub Release (private)
        uses: softprops/action-gh-release@v2
        with:
          # Explicit: on a manual run github.ref is refs/heads/main, so the action
          # cannot infer a tag and fails with "GitHub Releases requires a tag".
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: checksums.md
          fail_on_unmatched_files: false
          files: |
            drengr-*.tar.gz
            drengr-*.tar.gz.sha256
            drengr-*.sha256.asc
            checksums.txt

      # Release on public community repo (user-facing downloads)
      - name: Create GitHub Release (community)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.tag }}"

          # Single writer. scripts/release-local.sh publishes the same release,
          # and deleting one that already exists is what left 0.10.7 broken.
          if gh release view "${VERSION}" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
            echo "::notice::${VERSION} already exists on ${RELEASE_REPO}, leaving it untouched. If it is incomplete, delete it by hand and re-run this workflow."
            exit 0
          fi

          # GPG signing is skipped when the key secret is absent, so the .asc
          # files and checksums.txt may legitimately not exist.
          FILES=(drengr-*.tar.gz drengr-*.tar.gz.sha256)
          if [ -f drengr.mcpb ]; then
            FILES+=(drengr.mcpb)
          fi
          if compgen -G "drengr-*.sha256.asc" >/dev/null; then
            FILES+=(drengr-*.sha256.asc)
          fi
          if [ -f checksums.txt ]; then
            FILES+=(checksums.txt)
          fi

          NOTES="## Drengr ${VERSION}

          ### Install
          \`\`\`bash
          curl -fsSL https://drengr.dev/install.sh | bash
          \`\`\`
          Or via npm:
          \`\`\`bash
          npm install -g drengr
          \`\`\`

          ### SHA256 Checksums
          \`\`\`
          $(cat *.sha256)
          \`\`\`"

          gh release create "${VERSION}" \
            --repo "${RELEASE_REPO}" \
            --title "Drengr ${VERSION}" \
            --notes "${NOTES}" \
            "${FILES[@]}"

  npm-publish:
    needs: [resolve, release]
    runs-on: ubuntu-latest

    # Trusted publishing. npm mints a short-lived credential from this job's OIDC
    # identity, so there is no stored token to expire, leak or rotate, and no
    # staged publish waiting on a human 2FA approval. A 2FA-bypass token stages
    # every publish today and loses direct publish entirely around January 2027.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer; node 24 ships older.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Stage the platform packages
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"   # assets are named with the tag, v included
          VERSION="${TAG#v}"                # package.json versions are not
          mkdir -p dist && cd dist
          # Each platform package carries the binary for one os/cpu pair. npm picks
          # the right one from the package's own `os` and `cpu` fields, so no
          # lifecycle script has to download anything. npm v12 disables those
          # scripts by default, which is why the downloader could not stay.
          for pair in "x86_64-apple-darwin:darwin-x64" \
                      "aarch64-apple-darwin:darwin-arm64" \
                      "x86_64-unknown-linux-gnu:linux-x64" \
                      "aarch64-unknown-linux-gnu:linux-arm64"; do
            TARGET="${pair%%:*}"; PKG="${pair##*:}"
            gh release download "${TAG}" --repo "${RELEASE_REPO}" \
              --pattern "drengr-${TAG}-${TARGET}.tar.gz" --dir . --clobber
            mkdir -p "pkg/${PKG}"
            tar xzf "drengr-${TAG}-${TARGET}.tar.gz" -C "pkg/${PKG}"
            cp "../npm/platforms/${PKG}/package.json" "pkg/${PKG}/package.json"
            node -e "
              const f='pkg/${PKG}/package.json', p=require('./'+f);
              p.version='${VERSION}'; require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n');
            "
            test -x "pkg/${PKG}/drengr" || { echo "::error::no drengr binary in ${PKG}"; ls -R "pkg/${PKG}"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"

          # `npm view` is not authoritative here. The registry's read path lags its
          # write path by minutes, so a version that published seconds ago can still
          # read as absent, and a skip-check built on it republishes and collides.
          # The publish itself is the authority: a 403 "cannot publish over" means
          # the version is already there, which is the goal, not a failure. Only a
          # refusal that is NOT that is fatal.
          publish_one() {
            local name="$1" dir="$2" out status
            out=$(cd "$dir" && npm publish --access public 2>&1) && status=0 || status=$?
            printf '%s\n' "$out"
            if [ "$status" -eq 0 ]; then
              echo "::notice::${name}@${VERSION} published."
              return 0
            fi
            if printf '%s' "$out" | grep -qiE "cannot publish over|EPUBLISHCONFLICT"; then
              echo "::notice::${name}@${VERSION} was already published. Nothing to do."
              return 0
            fi
            echo "::error title=npm refused ${name}::If this is an auth failure, open the package on npmjs.com, Settings, Trusted publishing, and add this repository with workflow release.yml. Each package is authorised once."
            return 1
          }

          # Platform packages first: the main package declares them as optional
          # dependencies, so publishing it first would leave a window where an
          # install resolves nothing and the CLI has no binary.
          for PKG in darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            publish_one "drengr-${PKG}" "dist/pkg/${PKG}"
          done

          cd npm
          CURRENT=$(node -p "require('./package.json').version")
          [ "$CURRENT" = "$VERSION" ] || npm version "$VERSION" --no-git-tag-version
          publish_one "drengr" "."

      - name: Publish to MCP registry
        run: |
          if [ -z "$SEED" ]; then
            echo "::warning title=MCP registry not updated::npm and the GitHub release are live, but registry.modelcontextprotocol.io still serves the previous version. Add the MCP_REGISTRY_SEED secret, or run: mcp-publisher login http --domain drengr.dev --private-key \$SEED && mcp-publisher publish"
            exit 0
          fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login http --domain drengr.dev --private-key "$SEED"
          ./mcp-publisher publish
        env:
          SEED: ${{ secrets.MCP_REGISTRY_SEED }}
