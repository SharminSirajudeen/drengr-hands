name: Android E2E (headless ADB)

# Mirrors ios-e2e.yml for Android. Spins up a headless Android emulator,
# proves AdbTransport's screenshot / ui_tree / launch_app / tap pipeline
# works end-to-end against the device's built-in Settings app.
#
# Runs on every push to main so a broken merge can't silently ship.
# On PRs, only fires when the PR touches Android-relevant paths (cost
# discipline — the emulator boot eats ~5 min on every run).

on:
  # MANUAL ONLY (was: every push to main). Run before an Android release:
  #   gh workflow run "Android E2E (headless ADB)"
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Android E2E (headless, ubuntu-latest)
    # ubuntu-latest is x86_64 — pair with x86_64 emulator system image.
    # macos-latest gives KVM nested-virt for free but costs 10x more.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
        target: [google_apis]
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM nested virtualization
        # Required for the Android emulator to run with hardware accel on
        # ubuntu-latest. Without this it falls back to software TCG, which
        # is too slow for a useful test run (>15 min just to boot).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            android-e2e-${{ runner.os }}-

      - name: cargo check (default features)
        run: cargo check --workspace --all-targets

      - name: cargo check (android-e2e feature)
        run: cargo check --features android-e2e --test android_headless_adb

      - name: Unit tests (lib)
        run: cargo test --lib

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-v1

      - name: Create AVD + warm cache (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          disable-animations: true
          script: echo "AVD warmed"

      - name: End-to-end Android test (headless)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82  # unlock screen
            cargo test --features android-e2e --test android_headless_adb -- --nocapture
        env:
          RUST_LOG: drengr_mcp::transport=info
          RUST_BACKTRACE: 1

      - name: drengr doctor (post-run sanity)
        if: always()
        run: cargo run --quiet -- doctor || true

      - name: Upload drengr logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drengr-android-e2e-logs
          path: |
            ~/.drengr/mcp.log
          if-no-files-found: ignore
          retention-days: 7
