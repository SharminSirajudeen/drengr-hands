name: Rust

# Nothing built or tested this crate on any automatic trigger. The first thing
# that compiled a change was release.yml, on a tag push, by which point the
# regression was already being packaged for users.
#
# Path-gated and concurrency-cancelled: pushes that touch only docs, the landing
# site, the SDKs or the edge functions cost nothing, and a rapid series of
# commits bills for the last one rather than for each.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # A runner has no device. The Android end-to-end suite stays behind its
      # `android-e2e` feature and the iOS and MITM tests keep their `#[ignore]`,
      # so default features are the whole of what can run here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        run: cargo fmt --check

      # The crate went from a proprietary licence to MIT. Nothing had ever
      # checked what the dependency tree permits, and an MIT repo that links a
      # copyleft crate is a licensing problem nobody notices until it matters.
      - name: Licences
        run: cargo deny check licenses
